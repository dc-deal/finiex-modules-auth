[build-system]
requires = ["hatchling>=1.27"]     # PEP 639 licence metadata
build-backend = "hatchling.build"

[project]
name = "finiex-auth"
version = "0.2.0"
description = "Bearer tokens with per-name grants for FastAPI services, shared by the Finiex projects."
readme = "README.md"
# MIT for the code; the Finiex™ name is not covered — see the notice in LICENSE.
license = "MIT"
license-files = ["LICENSE"]
# The floor is the lowest consumer's interpreter (FiniexTestingIDE, 3.12). 3.12 evaluates annotations
# eagerly, so it is the stricter side: code verified there also runs on 3.14, not the other way round.
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",      # fastapi.testclient
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
    "ruff>=0.16.0",
    "pyflakes>=3.4.0",
    "vulture>=2.14",
]

# PEP 420: `finiex_auth/` carries no __init__.py, the same convention as both consumers.
[tool.hatch.build.targets.wheel]
packages = ["finiex_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
